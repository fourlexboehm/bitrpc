[package]
name = "compio-h3-rpc"
version = "0.1.0"
edition = "2024"
[workspace]

[dependencies]
bitrpc = { path = "../..", features = ["cyper", "compio-quic", "compio-server"] }
bitcode = "0.6.7"
compio = "0.16.0"
compio-buf = "0.7.0"
compio-fs = "0.9.0"
compio-io = "0.8.0"
compio-macros = "0.1.2"
compio-quic ={version = "0.5.0", features = ["h3"]}
compio-runtime = "0.9.1"
cyper = {version = "0.5.0", features = ["http3", "rustls"]}
http = "1.3.1"
compio-dispatcher = "0.8"
url = "2.5"
num_cpus = "1.16"

[build-dependencies]

[[bin]]
name = "client"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "client-quic"
path = "src/bin/client_quic.rs"


[profile.release]
debug = true
